<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AATOS — mobile preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0e0f12;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .phone {
    width: 402px;
    height: 874px;
    max-height: 96vh;
    background: #000;
    border-radius: 52px;
    padding: 12px;
    box-shadow: 0 0 0 2px #2a2c31, 0 24px 60px rgba(0,0,0,0.55);
    position: relative;
  }
  .notch {
    position: absolute;
    top: 20px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 30px;
    background: #000; border-radius: 16px; z-index: 3;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 42px; overflow: hidden;
    background: #000; position: relative;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  /* When the phone is taller than the viewport, scale it down to fit. */
  @media (max-height: 900px) {
    .phone { transform: scale(calc(96vh / 874)); transform-origin: center; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <iframe src="http://localhost:8083" title="AATOS app" allow="clipboard-write; microphone; autoplay"></iframe>
    </div>
  </div>
</body>
</html>
